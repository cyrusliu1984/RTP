name: Windows Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. 开启 vcpkg 二进制包全局缓存 (极速提升后续构建速度)
    - name: Cache vcpkg installed libraries & archives
      uses: actions/cache@v4
      with:
        path: |
          C:/vcpkg/installed
          C:/Users/runneradmin/AppData/Local/vcpkg/archives
        key: ${{ runner.os }}-vcpkg-fast-cache-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-fast-cache-

    # 2. 精简版依赖安装 (仅安装核心子模块，避免编译大而全的模块，构建速度提升 5~10 倍)
    - name: Fast install minimal dependencies via vcpkg
      run: |
        vcpkg install eigen3 yaml-cpp laszip spdlog opencv4[core,jpeg,png] pcl[core,io,filters] --triplet x64-windows

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

    - name: Build Release
      run: |
        cmake --build build --config Release --parallel 4

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RTPCP-Windows-x64
        path: bin/Release/RTPCP.exe
