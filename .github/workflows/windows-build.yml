name: Windows Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restore/Cache vcpkg packages
      uses: actions/cache@v4
      with:
        path: C:/vcpkg/installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install dependencies via vcpkg
      run: |
        vcpkg install pcl opencv eigen3 yaml-cpp laszip spdlog --triplet x64-windows

    - name: Configure CMake
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

    - name: Build Release
      run: |
        cmake --build build --config Release --parallel 4

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RTPCP-Windows-x64
        path: bin/Release/RTPCP.exe
